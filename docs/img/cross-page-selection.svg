<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Selecting text across a page: the lost finger lift</title>
<desc id="dsc">Stock: the page turns 1.20-1.25 s after the finger reaches the corner and the finger lift is lost. With libkppgrip and a 700 ms edge hold: the turn comes 0.94-1.07 s after reaching the corner, the lift is delivered and the selection bar appears 0.37-0.57 s after lifting.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:26px;font-weight:700}
.st{font-size:15px;fill:#59636e}
.h{font-size:17px;font-weight:700}
.l{font-size:15px}
.lb{font-size:15px;font-weight:600}
.s{font-size:13.5px;fill:#59636e}
.sx{font-size:13.5px}
.v{font-size:15px;font-weight:700;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.ax{font-size:13px;fill:#818b98}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}
.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;font-weight:700}
.badge{font-size:14px;font-weight:700}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d8dee4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8c959f" stroke-width="2.5"/></pattern><pattern id="hatchb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ddf4ff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6cb6ff" stroke-width="2.5"/></pattern></defs>
<rect x="1" y="1" width="998" height="618" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="36" y="50" class="t">Selecting text across a page: the lost finger lift</text>
<text x="36" y="78" class="st">Reader (KUX inside KPPMainApp), screen 1264 × 1680 px · one device, several runs each</text>
<rect x="40" y="116" width="210" height="280" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<rect x="58" y="138" width="174" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="162" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="186" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="210" width="174" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="234" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="258" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="282" width="174" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="306" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="330" width="160" height="7" rx="3" fill="#d1d9e0"/>
<rect x="58" y="354" width="174" height="7" rx="3" fill="#d1d9e0"/>
<rect x="100" y="279" width="132" height="12" rx="2" fill="#9cd1ff" fill-opacity="0.7"/>
<rect x="58" y="303" width="174" height="12" rx="2" fill="#9cd1ff" fill-opacity="0.7"/>
<rect x="238" y="116" width="12" height="280" fill="#cf222e" fill-opacity="0.35"/>
<rect x="40" y="384" width="210" height="12" fill="#cf222e" fill-opacity="0.35"/>
<circle cx="244" cy="390" r="13" fill="none" stroke="#cf222e" stroke-width="2.5"/>
<text x="40" y="426" class="s">Red: the touch driver's grip-</text>
<text x="40" y="445" class="s">suppression zone, x ≥ ~1225 or</text>
<text x="40" y="464" class="s">y ≥ ~1640 (≈40 px). A finger lifted</text>
<text x="40" y="483" class="s">here sends no release.</text>
<line x1="320" y1="116" x2="320" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="320" y="108" class="ax" text-anchor="middle">0.0 s</text>
<line x1="404" y1="116" x2="404" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="404" y="108" class="ax" text-anchor="middle">0.2 s</text>
<line x1="488" y1="116" x2="488" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="488" y="108" class="ax" text-anchor="middle">0.4 s</text>
<line x1="572" y1="116" x2="572" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="572" y="108" class="ax" text-anchor="middle">0.6 s</text>
<line x1="656" y1="116" x2="656" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="656" y="108" class="ax" text-anchor="middle">0.8 s</text>
<line x1="740" y1="116" x2="740" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="740" y="108" class="ax" text-anchor="middle">1.0 s</text>
<line x1="824" y1="116" x2="824" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="824" y="108" class="ax" text-anchor="middle">1.2 s</text>
<line x1="908" y1="116" x2="908" y2="416" stroke="#e6eaef" stroke-width="1"/>
<text x="908" y="108" class="ax" text-anchor="middle">1.4 s</text>
<text x="320" y="150" class="h" style="fill:#cf222e">Stock</text>
<rect x="320" y="172" width="420" height="26" rx="4" fill="#eaeef2"/>
<text x="330" y="190" class="sx" style="fill:#59636e">edge hold 1000 ms</text>
<rect x="740" y="172" width="126" height="26" rx="4" fill="url(#hatch)"/>
<text x="803" y="216" class="s" text-anchor="middle">+ up to 300 ms</text>
<rect x="818.9" y="166" width="30.78" height="38" rx="5" fill="#cf222e" fill-opacity="0.18"/>
<line x1="834.29" y1="166" x2="834.29" y2="204" stroke="#cf222e" stroke-width="3"/>
<text x="876" y="184" class="sx" style="fill:#cf222e" font-weight="700">page turns</text>
<text x="876" y="202" class="v" style="fill:#cf222e">1.20–1.25 s</text>
<rect x="320" y="226" width="610" height="32" rx="8" fill="#ffebe9"/>
<text x="334" y="247" class="sx" style="fill:#cf222e" font-weight="700">Finger lifted: release lost → no selection bar, the next touch continues the old selection</text>
<text x="320" y="300" class="h" style="fill:#1a7f37">With libkppgrip (first version) + KPPHOT_RSEL_EDGE=700</text>
<rect x="320" y="322" width="294" height="26" rx="4" fill="#eaeef2"/>
<text x="330" y="340" class="sx" style="fill:#59636e">edge hold 700 ms</text>
<rect x="614" y="322" width="126" height="26" rx="4" fill="url(#hatch)"/>
<text x="677" y="366" class="s" text-anchor="middle">+ up to 300 ms</text>
<rect x="709.7" y="316" width="61.86" height="38" rx="5" fill="#1a7f37" fill-opacity="0.18"/>
<line x1="740.63" y1="316" x2="740.63" y2="354" stroke="#1a7f37" stroke-width="3"/>
<text x="778.56" y="334" class="sx" style="fill:#1a7f37" font-weight="700">page turns</text>
<text x="778.56" y="352" class="v" style="fill:#1a7f37">0.94–1.07 s</text>
<rect x="320" y="376" width="610" height="32" rx="8" fill="#dafbe1"/>
<text x="334" y="397" class="sx" style="fill:#1a7f37" font-weight="700">Finger lifted: release delivered (6/6 gestures) → selection bar 0.37–0.57 s later</text>
<text x="36" y="520" class="s">Time axis: from the moment the finger reaches the corner. The hold is 1000 ms (or 700 ms) plus up to 300 ms of</text>
<text x="36" y="541" class="s">selection-update throttle. libkppgrip turns grip suppression off only between the long-press and the release (30 s</text>
<text x="36" y="562" class="s">watchdog), then restores it. With the stock 1000 ms hold the release also arrived (3/3). Library page turns: neutral A/B.</text>
<text x="36" y="583" class="s">Measured with the first version of libkppgrip (src/kppgrip/kppgrip.c); the v2 rewrite failed its first device test.</text>
</svg>
