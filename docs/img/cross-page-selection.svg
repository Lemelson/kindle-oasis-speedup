<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1b1f24">Selecting text across a page: the lost finger lift</text>
<text x="24" y="62" font-size="14" fill="#57606a">Reader (KUX inside KPPMainApp). Screen 1264 × 1680 px. Measured on one device, several runs each.</text>
<rect x="40" y="90" width="252" height="336" rx="6" fill="#fafbfc" stroke="#57606a" stroke-width="2"/>
<rect x="58" y="114" width="216" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="140" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="166" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="192" width="216" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="218" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="244" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="270" width="216" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="296" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="322" width="202" height="8" rx="3" fill="#d8dee4"/>
<rect x="58" y="348" width="216" height="8" rx="3" fill="#d8dee4"/>
<rect x="284" y="90" width="8" height="336" fill="#cf2222" opacity="0.55"/>
<rect x="40" y="418" width="252" height="8" fill="#cf2222" opacity="0.55"/>
<circle cx="288" cy="422" r="10" fill="none" stroke="#cf2222" stroke-width="2"/>
<text x="40" y="450" font-size="12" fill="#1b1f24">Red: Xorg grip-suppression zone,</text>
<text x="40" y="466" font-size="12" fill="#1b1f24">x ≥ ~1225 or y ≥ ~1640 (≈40 px).</text>
<text x="40" y="482" font-size="12" fill="#1b1f24">A finger lifted here sends no release.</text>
<text x="340" y="110" font-size="15" font-weight="700" fill="#cf2222">Stock</text>
<line x1="340" y1="140" x2="1020.4" y2="140" stroke="#8c959f" stroke-width="3"/>
<circle cx="340" cy="140" r="6" fill="#57606a"/>
<text x="340" y="164" font-size="12" fill="#1b1f24" text-anchor="middle">finger reaches</text>
<text x="340" y="179" font-size="12" fill="#1b1f24" text-anchor="middle">the corner</text>
<circle cx="865" cy="140" r="6" fill="#cf2222"/>
<text x="865" y="164" font-size="12" fill="#1b1f24" text-anchor="middle">page turns</text>
<text x="865" y="179" font-size="12" fill="#1b1f24" text-anchor="middle">≈1.25 s</text>
<circle cx="1012" cy="140" r="6" fill="#cf2222"/>
<text x="1012" y="164" font-size="12" fill="#1b1f24" text-anchor="middle">lift: lost →</text>
<text x="1012" y="179" font-size="12" fill="#1b1f24" text-anchor="middle">selection frozen</text>
<text x="340" y="212" font-size="13" fill="#57606a">Hold at the edge = 1000 ms + up to 300 ms throttle. After the turn the lift never arrives: no selection bar, next touch continues it.</text>
<text x="340" y="270" font-size="15" font-weight="700" fill="#1f8a4c">With libkppgrip (first version) + KPPHOT_RSEL_EDGE=700</text>
<line x1="340" y1="300" x2="1020.4" y2="300" stroke="#8c959f" stroke-width="3"/>
<circle cx="340" cy="300" r="6" fill="#57606a"/>
<text x="340" y="324" font-size="12" fill="#1b1f24" text-anchor="middle">finger reaches</text>
<text x="340" y="339" font-size="12" fill="#1b1f24" text-anchor="middle">the corner</text>
<circle cx="735" cy="300" r="6" fill="#1f8a4c"/>
<text x="735" y="324" font-size="12" fill="#1b1f24" text-anchor="middle">page turns</text>
<text x="735" y="339" font-size="12" fill="#1b1f24" text-anchor="middle">≈0.94–1.07 s</text>
<circle cx="970" cy="300" r="6" fill="#1f8a4c"/>
<text x="970" y="324" font-size="12" fill="#1b1f24" text-anchor="middle">lift delivered</text>
<text x="970" y="339" font-size="12" fill="#1b1f24" text-anchor="middle">bar after 0.37–0.57 s</text>
<text x="340" y="372" font-size="13" fill="#57606a">Grip suppression is switched off only between the long-press and the release (30 s watchdog), then restored.</text>
<text x="340" y="440" font-size="13" fill="#1b1f24">Stock turn 1195–1254 ms after reaching the corner → 935–1068 ms with 700 ms; release delivered in every run (3/3 and 6/6 gestures).</text>
<text x="340" y="460" font-size="13" fill="#1b1f24">Library page turns with both libs loaded: unchanged (neutral A/B).</text>
<text x="340" y="480" font-size="13" fill="#57606a">Root cause found on the device: XI property "Multitouch Grip Suppression" of the touch driver.</text>
<text x="340" y="500" font-size="13" fill="#57606a">Measured with the first version of libkppgrip; the rewrite in src/kppgrip failed its first device test.</text>
</svg>