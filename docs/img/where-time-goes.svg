<text x="236.7" y="483" class="sx" font-weight="700">29</text>
<text x="260.7" y="483" class="s">JPEG scale, gray→RGB</text>
<text x="150" y="512" class="l" text-anchor="end">pixman</text>
<rect x="162" y="498" width="59.8" height="20" rx="3" fill="#8c959f"/>
<text x="229.8" y="513" class="sx" font-weight="700">26</text>
<text x="150" y="542" class="l" text-anchor="end">glib / gobject</text>
<rect x="162" y="528" width="41.4" height="20" rx="3" fill="#8c959f"/>
<text x="211.4" y="543" class="sx" font-weight="700">18</text>
<text x="150" y="572" class="l" text-anchor="end">libReactNative</text>
<rect x="162" y="558" width="41.4" height="20" rx="3" fill="#8c959f"/>
<text x="211.4" y="573" class="sx" font-weight="700">18</text>
<text x="235.4" y="573" class="s">LZ4 of the cover cache</text>
<text x="150" y="602" class="l" text-anchor="end">pthread</text>
<rect x="162" y="588" width="31.05" height="20" rx="3" fill="#8c959f"/>
<text x="201.05" y="603" class="sx" font-weight="700">13.5</text>
<text x="150" y="632" class="l" text-anchor="end">libjpeg</text>
<rect x="162" y="618" width="20.7" height="20" rx="3" fill="#8c959f"/>
<text x="190.7" y="633" class="sx" font-weight="700">9</text>
<text x="150" y="662" class="l" text-anchor="end">libX11</text>
<rect x="162" y="648" width="18.4" height="20" rx="3" fill="#8c959f"/>
<text x="188.4" y="663" class="sx" font-weight="700">8</text>
<text x="150" y="692" class="l" text-anchor="end">libm</text>
<rect x="162" y="678" width="16.1" height="20" rx="3" fill="#8c959f"/>
<text x="186.1" y="693" class="sx" font-weight="700">7</text>
<text x="201.1" y="693" class="s">sin in the Lanczos kernel</text>
<text x="150" y="722" class="l" text-anchor="end">other</text>
<rect x="162" y="708" width="67.85" height="20" rx="3" fill="#eff2f5"/>
<text x="237.85" y="723" class="sx" font-weight="700">29.5</text>
<text x="660" y="392" class="l" text-anchor="end">cached-tile path</text>
<rect x="672" y="378" width="69" height="20" rx="3" fill="#0969da"/>
<text x="749" y="393" class="sx" font-weight="700">30</text>
<text x="773" y="393" class="s">4→8 bit→RGB→gray</text>
<text x="660" y="422" class="l" text-anchor="end">cairo</text>
<rect x="672" y="408" width="66.7" height="20" rx="3" fill="#0969da"/>
<text x="746.7" y="423" class="sx" font-weight="700">29</text>
<text x="770.7" y="423" class="s">vector badges, ribbons</text>
<text x="660" y="452" class="l" text-anchor="end">pixman</text>
<rect x="672" y="438" width="36.8" height="20" rx="3" fill="#0969da"/>
<text x="716.8" y="453" class="sx" font-weight="700">16</text>
<text x="660" y="482" class="l" text-anchor="end">glib / gobject</text>
<rect x="672" y="468" width="36.8" height="20" rx="3" fill="#0969da"/>
<text x="716.8" y="483" class="sx" font-weight="700">16</text>
<text x="660" y="512" class="l" text-anchor="end">X protocol I/O</text>
<rect x="672" y="498" width="32.2" height="20" rx="3" fill="#0969da"/>
<text x="712.2" y="513" class="sx" font-weight="700">14</text>
<text x="660" y="542" class="l" text-anchor="end">LZ4</text>
<rect x="672" y="528" width="29.9" height="20" rx="3" fill="#0969da"/>
<text x="709.9" y="543" class="sx" font-weight="700">13</text>
<text x="660" y="572" class="l" text-anchor="end">memcpy</text>
<rect x="672" y="558" width="27.6" height="20" rx="3" fill="#0969da"/>
<text x="707.6" y="573" class="sx" font-weight="700">12</text>
<text x="660" y="602" class="l" text-anchor="end">mmap / munmap</text>
<rect x="672" y="588" width="13.8" height="20" rx="3" fill="#0969da"/>
<text x="693.8" y="603" class="sx" font-weight="700">6</text>
<text x="660" y="632" class="l" text-anchor="end">other</text>
<rect x="672" y="618" width="170.2" height="20" rx="3" fill="#ddf4ff"/>
<text x="850.2" y="633" class="sx" font-weight="700">74</text>
<text x="36" y="758" class="s">With the 16 MB whole-item cache on top, a revisit costs 6–7 main-thread ticks (≈65 ms) instead of 18–19: Amazon's own</text>
<text x="36" y="779" class="s">cache then draws the finished grid item and skips the badge/ribbon drawing, the X read-back and the tile path.</text>
<text x="36" y="800" class="s">JS thread: 145 ms stock, 129 ms before the item cache. Ticks: 10 ms of CPU from /proc/&lt;pid&gt;/stat.</text>
<text x="964" y="825" class="s" text-anchor="end">Source: docs/RESULTS.md</text>
</svg>
