<text x="24" y="392" font-size="13" fill="#57606a">"Accelerated" = fs, x11, malloc, img, hot, side, db, log + 16 MB cover cache, measured with the profiler loaded. JS thread: 145 → 129 ms.</text>
<text x="24" y="412" font-size="13" fill="#57606a">With the 16 MB whole-item cache on top, a revisit costs 6–7 main-thread ticks (≈65 ms) instead of 18–19 (≈190 ms): Amazon's own</text>
<text x="24" y="430" font-size="13" fill="#57606a">cache then draws the finished grid item and skips the badge/ribbon drawing, X read-back and tile path entirely.</text>
