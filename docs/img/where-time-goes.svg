<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Where the main thread spends CPU per Library page turn</title>
<desc id="dsc">Main-thread CPU per Library page turn: Amazon stock 341 ms, kppfast before the whole-item cache 210 ms, kppfast on a revisit with the whole-item cache about 65 ms. Breakdown by library for the first two.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:26px;font-weight:700}
.st{font-size:15px;fill:#59636e}
.h{font-size:17px;font-weight:700}
.l{font-size:15px}
.lb{font-size:15px;font-weight:600}
.s{font-size:13.5px;fill:#59636e}
.sx{font-size:13.5px}
.v{font-size:15px;font-weight:700;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.ax{font-size:13px;fill:#818b98}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}
.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;font-weight:700}
.badge{font-size:14px;font-weight:700}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d8dee4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8c959f" stroke-width="2.5"/></pattern><pattern id="hatchb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ddf4ff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6cb6ff" stroke-width="2.5"/></pattern></defs>
<rect x="1" y="1" width="998" height="878" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="36" y="50" class="t">Where the main thread spends CPU per Library page turn</text>
<text x="36" y="78" class="st">ms of CPU per turn · SIGPROF profiles (40–60 turns) and per-turn tick counts · one device</text>
<text x="40" y="128" class="lb">Amazon stock</text>
<rect x="40" y="138" width="750.2" height="26" rx="4" fill="#8c959f"/>
<text x="800.2" y="157" class="v">341 ms</text>
<text x="40" y="194" class="l">kppfast, before the whole-item cache (fs, x11, malloc, img, hot, side, db, log, 16 MB cover cache)</text>
<rect x="40" y="204" width="462" height="26" rx="4" fill="#0969da"/>
<text x="512" y="223" class="v">210 ms</text>
<rect x="602" y="204" width="72" height="26" rx="13" fill="#ddf4ff"/>
<text x="638" y="222" class="badge" text-anchor="middle" style="fill:#0969da">−38 %</text>
<text x="40" y="260" class="l">kppfast with the whole-item cache, page seen before (6–7 ticks of 10 ms)</text>
<rect x="40" y="270" width="132" height="26" rx="4" fill="#1a7f37"/>
<rect x="168" y="270" width="26" height="26" rx="4" fill="#1a7f37" fill-opacity="0.4"/>
<text x="204" y="289" class="v">60–70 ms</text>
<rect x="294" y="270" width="72" height="26" rx="13" fill="#1a7f37"/>
<text x="330" y="288" class="badge" text-anchor="middle" style="fill:#ffffff">−81 %</text>
<line x1="36" y1="322" x2="964" y2="322" stroke="#e6eaef" stroke-width="1"/>
<text x="40" y="354" class="h">Stock, by library (341 ms)</text>
<text x="540" y="354" class="h">kppfast before the item cache (210 ms)</text>
<text x="150" y="392" class="l" text-anchor="end">libc</text>
<rect x="162" y="378" width="202.4" height="20" rx="3" fill="#8c959f"/>
<text x="372.4" y="393" class="sx" font-weight="700">88</text>
