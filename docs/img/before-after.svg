<line x1="410" y1="378" x2="800" y2="378" stroke="#c8d1da" stroke-width="1"/>
<text x="40" y="200" class="lb">Page seen before</text>
<text x="40" y="219" class="s">any page visited before</text>
<line x1="555.5" y1="204" x2="740.25" y2="204" stroke="#afb8c1" stroke-width="2" marker-start="url(#arr)"/>
<rect x="743.25" y="196" width="35.5" height="16" rx="8" fill="#8c959f"/>
