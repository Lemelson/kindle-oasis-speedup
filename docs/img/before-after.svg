<text x="900" y="209" class="badge" text-anchor="middle" style="fill:#ffffff">≈2.6× faster</text>
<text x="40" y="266" class="lb">Straight after a reboot</text>
<text x="40" y="285" class="s">page seen before; caches mirrored to flash</text>
<line x1="555.5" y1="270" x2="740.25" y2="270" stroke="#afb8c1" stroke-width="2" marker-start="url(#arr)"/>
<rect x="743.25" y="262" width="35.5" height="16" rx="8" fill="#8c959f"/>
<rect x="528.75" y="262" width="25.75" height="16" rx="8" fill="#1a7f37"/>
<text x="761" y="254" class="sx" text-anchor="middle" style="fill:#59636e">0.70–0.74 s</text>
<text x="541.625" y="298" class="v" text-anchor="middle" style="fill:#1a7f37">0.26–0.28 s</text>
<rect x="836" y="256" width="128" height="28" rx="14" fill="#1a7f37"/>
<text x="900" y="275" class="badge" text-anchor="middle" style="fill:#ffffff">≈2.6× faster</text>
<text x="40" y="332" class="lb">Page never seen before</text>
<text x="40" y="351" class="s">first ever visit, caches empty</text>
<line x1="623.75" y1="336" x2="740.25" y2="336" stroke="#afb8c1" stroke-width="2" marker-start="url(#arr)"/>
