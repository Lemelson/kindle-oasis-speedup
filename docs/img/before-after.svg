<rect x="836" y="496" width="128" height="28" rx="14" fill="#1a7f37"/>
<text x="900" y="515" class="badge" text-anchor="middle" style="fill:#ffffff">−81 %</text>
<text x="40" y="572" class="lb">Page not in the item cache</text>
<text x="40" y="591" class="s">profile without the item cache</text>
