<text x="741.11" y="734" class="sx" text-anchor="middle" style="fill:#59636e">1.20–1.25 s</text>
<text x="567.17" y="778" class="v" text-anchor="middle" style="fill:#1a7f37">0.94–1.07 s</text>
<rect x="836" y="736" width="128" height="28" rx="14" fill="#dafbe1"/>
<text x="900" y="755" class="badge" text-anchor="middle" style="fill:#1a7f37">≈0.2 s sooner</text>
<text x="40" y="861" class="lb">Finger lift after the turn</text>
