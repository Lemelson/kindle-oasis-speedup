<text x="521.429" y="638" class="ax" text-anchor="middle">100 ms</text>
<line x1="632.857" y1="614" x2="632.857" y2="622" stroke="#c8d1da" stroke-width="1"/>
<text x="632.857" y="638" class="ax" text-anchor="middle">200 ms</text>
