<circle cx="856" cy="82" r="8" fill="#1a7f37"/>
<text x="870" y="87" class="sx">kppfast</text>
<line x1="36" y1="120" x2="964" y2="120" stroke="#e6eaef" stroke-width="1"/>
<text x="40" y="150" class="h">Library page turn: time to idle (settle)*</text>
<line x1="410" y1="374" x2="410" y2="382" stroke="#c8d1da" stroke-width="1"/>
<text x="410" y="398" class="ax" text-anchor="middle">0.0 s</text>
<line x1="507.5" y1="374" x2="507.5" y2="382" stroke="#c8d1da" stroke-width="1"/>
<text x="507.5" y="398" class="ax" text-anchor="middle">0.2 s</text>
<line x1="605" y1="374" x2="605" y2="382" stroke="#c8d1da" stroke-width="1"/>
