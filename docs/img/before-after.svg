<text x="900" y="907" class="badge" text-anchor="middle" style="fill:#ffffff">fixed</text>
<text x="36" y="958" class="s">* Settle = start of the injected key press until KPPMainApp's main and JS threads are idle; includes ~60–76 ms of key</text>
<text x="36" y="978" class="s">injection, excludes the e-ink refresh. CPU: SIGPROF profiles and 10 ms tick counts. Selection: first version of libkppgrip</text>
<text x="36" y="998" class="s">with a 700 ms edge hold (stock 1000 ms). Book open, reader page turns, wake, quick settings and sleep were measured and left as stock.</text>
</svg>
