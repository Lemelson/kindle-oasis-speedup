<line x1="566" y1="788" x2="566" y2="796" stroke="#c8d1da" stroke-width="1"/>
<text x="566" y="812" class="ax" text-anchor="middle">1.0 s</text>
<line x1="644" y1="788" x2="644" y2="796" stroke="#c8d1da" stroke-width="1"/>
