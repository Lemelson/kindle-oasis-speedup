<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1032" width="1000" height="1032" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Before and after: Amazon stock vs kppfast</title>
<desc id="dsc">Library page turn (time to idle) from 0.70-0.74 s to 0.26-0.28 s on pages seen before, also after a reboot, and about 0.42 s on a page's first visit; main-thread CPU per turn from 341 ms to about 65 ms on a revisit; cross-page text selection turns about 0.2 s sooner and the finger lift and selection bar now work.</desc>
