<line x1="722" y1="788" x2="722" y2="796" stroke="#c8d1da" stroke-width="1"/>
<text x="722" y="812" class="ax" text-anchor="middle">1.2 s</text>
<line x1="800" y1="788" x2="800" y2="796" stroke="#c8d1da" stroke-width="1"/>
