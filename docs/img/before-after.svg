<text x="614.75" y="364" class="v" text-anchor="middle" style="fill:#1a7f37">≈0.42 s</text>
<rect x="836" y="322" width="128" height="28" rx="14" fill="#dafbe1"/>
<text x="900" y="341" class="badge" text-anchor="middle" style="fill:#1a7f37">≈1.7× faster</text>
