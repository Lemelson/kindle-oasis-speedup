<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1b1f24">How kppfast works</text>
<text x="24" y="62" font-size="14" fill="#57606a">No Amazon file is replaced. One line in the upstart job; everything else lives in /var/local/kppfast and is loaded with LD_PRELOAD.</text>
<rect x="24" y="86" width="300" height="92" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="36" y="108" font-size="14" font-weight="700" fill="#1b1f24">upstart job kppmainapp</text>
<text x="36" y="126" font-size="13"  fill="#1b1f24">+1 line: exec launch.sh unless</text>
<text x="36" y="144" font-size="13"  fill="#1b1f24">/mnt/us/DISABLE_KPPFAST exists</text>
<rect x="370" y="86" width="330" height="128" rx="8" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="382" y="108" font-size="14" font-weight="700" fill="#1b1f24">launch.sh (fail-safe gate)</text>
<text x="382" y="126" font-size="13"  fill="#1b1f24">stock start if: kill switch, 'disabled',</text>
<text x="382" y="144" font-size="13"  fill="#1b1f24">2 failed starts, ≥4 starts in 30 min,</text>
<text x="382" y="162" font-size="13"  fill="#1b1f24">lib not in SHA256SUMS, env not KPP*=…</text>
<text x="382" y="180" font-size="13"  fill="#1b1f24">watcher: no LIPC answer in 180 s → fail</text>
<rect x="746" y="86" width="270" height="92" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="758" y="108" font-size="14" font-weight="700" fill="#1b1f24">exec KPPMainApp</text>
<text x="758" y="126" font-size="13"  fill="#1b1f24">same pid for upstart;</text>
<text x="758" y="144" font-size="13"  fill="#1b1f24">LD_PRELOAD = preload.list</text>
<line x1="324" y1="132" x2="368" y2="132" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="700" y1="132" x2="744" y2="132" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="240" width="992" height="300" rx="12" fill="#f3f8ff" stroke="#5589c8" stroke-width="2"/>
<text x="40" y="266" font-size="16" font-weight="700" fill="#1b1f24">Amazon's KPPMainApp process (React Native for Linux + GTK2/GDK/cairo, unchanged binaries)</text>
<rect x="40" y="280" width="232" height="130" rx="8" fill="#ffffff" stroke="#a8c1e0" stroke-width="1.5"/>
<text x="52" y="302" font-size="13" font-weight="700" fill="#1b1f24">Files / I/O</text>
<text x="52" y="320" font-size="12"  fill="#1b1f24">libkppfs  stat/open cache,</text>
<text x="52" y="338" font-size="12"  fill="#1b1f24">  negative lookups</text>
<text x="52" y="356" font-size="12"  fill="#1b1f24">libkppio  buffered reads</text>
<text x="52" y="374" font-size="12"  fill="#1b1f24">  (built, not in baseline)</text>
<rect x="284" y="280" width="232" height="130" rx="8" fill="#ffffff" stroke="#a8c1e0" stroke-width="1.5"/>
<text x="296" y="302" font-size="13" font-weight="700" fill="#1b1f24">Graphics</text>
<text x="296" y="320" font-size="12"  fill="#1b1f24">libkppx11  X11 SHM put/get,</text>
<text x="296" y="338" font-size="12"  fill="#1b1f24">  read-back from window</text>
<text x="296" y="356" font-size="12"  fill="#1b1f24">libkppimg  NEON gray→RGB</text>
<text x="296" y="374" font-size="12"  fill="#1b1f24">libkpphot  in-memory patches</text>
<rect x="528" y="280" width="232" height="130" rx="8" fill="#ffffff" stroke="#a8c1e0" stroke-width="1.5"/>
<text x="540" y="302" font-size="13" font-weight="700" fill="#1b1f24">Memory / JS side</text>
<text x="540" y="320" font-size="12"  fill="#1b1f24">libkppmalloc  per-thread</text>
<text x="540" y="338" font-size="12"  fill="#1b1f24">  free lists (glibc 2.20)</text>
<text x="540" y="356" font-size="12"  fill="#1b1f24">libkppside  weblab, devcap</text>
<text x="540" y="374" font-size="12"  fill="#1b1f24">libkppdb  stmt reuse</text>
<rect x="772" y="280" width="232" height="130" rx="8" fill="#ffffff" stroke="#a8c1e0" stroke-width="1.5"/>
<text x="784" y="302" font-size="13" font-weight="700" fill="#1b1f24">Caches + input</text>
<text x="784" y="320" font-size="12"  fill="#1b1f24">libkppcc  Amazon's caches</text>
<text x="784" y="338" font-size="12"  fill="#1b1f24">  2→16 MB, 1→16 MB, mirror</text>
<text x="784" y="356" font-size="12"  fill="#1b1f24">libkpplog  one log switch</text>
<text x="784" y="374" font-size="12"  fill="#1b1f24">libkppgrip  edge lift fix</text>
<rect x="40" y="424" width="960" height="100" rx="8" fill="#eef7ee" stroke="#4c9a5b" stroke-width="1.5"/>
<text x="52" y="448" font-size="14" font-weight="700" fill="#1b1f24">Every patch: own KPP* switch (default off) · exact firmware check before writing · original code on any mismatch</text>
<text x="52" y="470" font-size="13" fill="#1b1f24">libkpphot / libkppcc: file size + exact bytes (generated from your device) or FNV/sha256 hash of each code region → write → flush cache.</text>
<text x="52" y="490" font-size="13" fill="#1b1f24">Interposers: active only inside KPPMainApp (checked by /proc/self/exe); in any other process they are inert.</text>
<text x="52" y="510" font-size="13" fill="#1b1f24">The caches stay Amazon's own: same file format, same keys; kppcc only raises the size limit and copies finished files to flash.</text>
<line x1="880" y1="178" x2="880" y2="238" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="566" width="300" height="110" rx="8" fill="#fff0f0" stroke="#cf6f6f" stroke-width="1.5"/>
<text x="36" y="588" font-size="14" font-weight="700" fill="#1b1f24">Kill switch</text>
<text x="36" y="606" font-size="13"  fill="#1b1f24">touch /mnt/us/DISABLE_KPPFAST</text>
<text x="36" y="624" font-size="13"  fill="#1b1f24">(over USB): next start is stock</text>
<rect x="370" y="566" width="300" height="110" rx="8" fill="#fff0f0" stroke="#cf6f6f" stroke-width="1.5"/>
<text x="382" y="588" font-size="14" font-weight="700" fill="#1b1f24">KUAL → Safe mode</text>
<text x="382" y="606" font-size="13"  fill="#1b1f24">reboot · accelerator off/on ·</text>
<text x="382" y="624" font-size="13"  fill="#1b1f24">everything off — no computer needed</text>
<rect x="716" y="566" width="300" height="110" rx="8" fill="#fff0f0" stroke="#cf6f6f" stroke-width="1.5"/>
<text x="728" y="588" font-size="14" font-weight="700" fill="#1b1f24">rollback.sh --restart</text>
<text x="728" y="606" font-size="13"  fill="#1b1f24">stock upstart job back,</text>
<text x="728" y="624" font-size="13"  fill="#1b1f24">/var/local/kppfast removed</text>
</svg>