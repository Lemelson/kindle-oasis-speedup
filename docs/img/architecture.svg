<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 912" width="1000" height="912" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How kppfast works</title>
<desc id="dsc">One line in Amazon's upstart job runs launch.sh, a fail-safe gate that execs Amazon's unchanged KPPMainApp with kppfast libraries in LD_PRELOAD. Each library has its own switch; patches are verified byte by byte; three ways back to stock.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:26px;font-weight:700}
.st{font-size:15px;fill:#59636e}
.h{font-size:17px;font-weight:700}
.l{font-size:15px}
.lb{font-size:15px;font-weight:600}
.s{font-size:13.5px;fill:#59636e}
.sx{font-size:13.5px}
.v{font-size:15px;font-weight:700;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.ax{font-size:13px;fill:#818b98}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}
.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;font-weight:700}
.badge{font-size:14px;font-weight:700}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d8dee4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8c959f" stroke-width="2.5"/></pattern><pattern id="hatchb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ddf4ff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6cb6ff" stroke-width="2.5"/></pattern></defs>
<rect x="1" y="1" width="998" height="910" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="36" y="50" class="t">How kppfast works</text>
<text x="36" y="78" class="st">No Amazon file is replaced: one line in the upstart job, everything else lives in /var/local/kppfast</text>
<rect x="36" y="104" width="16" height="16" rx="4" fill="#eff2f5" stroke="#8c959f" stroke-width="1.5"/>
<text x="60" y="117" class="sx">Amazon (unchanged)</text>
<rect x="222.8" y="104" width="16" height="16" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="246.8" y="117" class="sx">kppfast</text>
<rect x="326" y="104" width="16" height="16" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="350" y="117" class="sx">guard rails</text>
<rect x="459.6" y="104" width="16" height="16" rx="4" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="483.6" y="117" class="sx">ways back to stock</text>
<rect x="36" y="146" width="266" height="164" rx="12" fill="#eff2f5" stroke="#8c959f" stroke-width="1.5"/>
<text x="54" y="176" class="h">Upstart job kppmainapp</text>
<text x="54" y="202" class="sx">Amazon's job, plus one line:</text>
<text x="54" y="223" class="sx" xml:space="preserve" style="white-space:pre"><tspan>exec </tspan><tspan class="m">launch.sh</tspan><tspan> unless</tspan></text>
<text x="54" y="244" class="sx" xml:space="preserve" style="white-space:pre"><tspan class="m">/mnt/us/DISABLE_KPPFAST</tspan></text>
<text x="54" y="265" class="sx">exists</text>
<rect x="346" y="146" width="306" height="164" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="364" y="176" class="h">launch.sh, fail-safe gate</text>
<text x="364" y="202" class="sx">Starts stock on: kill switch, 'disabled',</text>
<text x="364" y="223" class="sx">2 failed starts, ≥ 4 starts in 30 min,</text>
<text x="364" y="244" class="sx">a library missing or not in SHA256SUMS.</text>
<text x="364" y="265" class="sx">Exports only KPP*= switches from env.</text>
<text x="364" y="286" class="sx">No LIPC answer in 180 s = a failure.</text>
<rect x="698" y="146" width="266" height="164" rx="12" fill="#eff2f5" stroke="#8c959f" stroke-width="1.5"/>
<text x="716" y="176" class="h">exec KPPMainApp</text>
<text x="716" y="202" class="sx">Amazon's binary, same pid for upstart,</text>
<text x="716" y="223" class="sx" xml:space="preserve" style="white-space:pre"><tspan class="m">LD_PRELOAD</tspan><tspan> = preload.list</tspan></text>
<line x1="306" y1="228" x2="340" y2="228" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/>
<line x1="656" y1="228" x2="692" y2="228" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/>
<line x1="831" y1="314" x2="831" y2="348" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/>
<rect x="36" y="354" width="928" height="392" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="56" y="386" class="h">Amazon's KPPMainApp process</text>
<text x="56" y="408" class="s">React Native for Linux + GTK2/GDK/cairo · binaries unchanged on disk · kppfast libraries loaded into it:</text>
<rect x="56" y="428" width="210" height="186" rx="10" fill="#ffffff" stroke="#9cd1ff" stroke-width="1.5"/>
<text x="70" y="454" class="lb" style="fill:#0969da">Files / I/O</text>
<text x="70" y="480" class="mb">libkppfs</text>
<text x="70" y="498" class="s">stat memo, missing-file memo</text>
<text x="70" y="523" class="mb">libkppio</text>
<text x="70" y="541" class="s">buffered reads (built,</text>
<text x="70" y="558" class="s">not in the baseline)</text>
<rect x="282" y="428" width="210" height="186" rx="10" fill="#ffffff" stroke="#9cd1ff" stroke-width="1.5"/>
<text x="296" y="454" class="lb" style="fill:#0969da">Graphics</text>
<text x="296" y="480" class="mb">libkppx11</text>
<text x="296" y="498" class="s">X11 SHM put/get,</text>
<text x="296" y="515" class="s">read-back from window</text>
<text x="296" y="540" class="mb">libkppimg</text>
<text x="296" y="558" class="s">NEON gray→RGB</text>
<text x="296" y="583" class="mb">libkpphot</text>
<text x="296" y="601" class="s">in-memory patches</text>
<rect x="508" y="428" width="210" height="186" rx="10" fill="#ffffff" stroke="#9cd1ff" stroke-width="1.5"/>
<text x="522" y="454" class="lb" style="fill:#0969da">Memory / JS side</text>
<text x="522" y="480" class="mb">libkppmalloc</text>
<text x="522" y="498" class="s">per-thread free lists</text>
<text x="522" y="515" class="s">(glibc 2.20)</text>
<text x="522" y="540" class="mb">libkppside</text>
<text x="522" y="558" class="s">weblab, device capability</text>
<text x="522" y="583" class="mb">libkppdb</text>
<text x="522" y="601" class="s">prepared-statement reuse</text>
<rect x="734" y="428" width="210" height="186" rx="10" fill="#ffffff" stroke="#9cd1ff" stroke-width="1.5"/>
<text x="748" y="454" class="lb" style="fill:#0969da">Caches + input</text>
<text x="748" y="480" class="mb">libkppcc</text>
<text x="748" y="498" class="s">Amazon's caches 2→16 MB</text>
<text x="748" y="515" class="s">and 1→16 MB, mirrored</text>
<text x="748" y="540" class="mb">libkpplog</text>
<text x="748" y="558" class="s">one log switch</text>
<text x="748" y="583" class="mb">libkppgrip</text>
<text x="748" y="601" class="s">edge finger-lift fix</text>
<rect x="56" y="630" width="888" height="96" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="74" y="656" class="lb" style="fill:#1a7f37">Guard rails for every patch</text>
<text x="74" y="677" class="s" style="fill:#1f2328">Own KPP* switch, off unless set. libkpphot / libkppcc check file size + exact bytes (generated from your device) or an</text>
<text x="74" y="694" class="s" style="fill:#1f2328">FNV/sha256 hash of each code region before writing; on any mismatch the original runs. Interposers are inert outside</text>
<text x="74" y="711" class="s" style="fill:#1f2328">KPPMainApp (/proc/self/exe). Caches keep Amazon's format and keys; kppcc only raises the limit and copies files to flash.</text>
<text x="40" y="780" class="h">Ways back to stock</text>
<rect x="36" y="794" width="296" height="100" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="54" y="824" class="h">Kill switch</text>
<text x="54" y="850" class="sx" xml:space="preserve" style="white-space:pre"><tspan>touch </tspan><tspan class="m">/mnt/us/DISABLE_KPPFAST</tspan></text>
<text x="54" y="871" class="sx">(over USB): the next start is stock</text>
<rect x="352" y="794" width="296" height="100" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="370" y="824" class="h">KUAL → Safe mode</text>
<text x="370" y="850" class="sx">reboot · accelerator off/on · everything off,</text>
<text x="370" y="871" class="sx">no computer needed</text>
<rect x="668" y="794" width="296" height="100" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="686" y="824" class="mb">rollback.sh --restart</text>
<text x="686" y="850" class="sx">stock upstart job back,</text>
<text x="686" y="871" class="sx" xml:space="preserve" style="white-space:pre"><tspan class="m">/var/local/kppfast</tspan><tspan> removed</tspan></text>
</svg>
