<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 782" width="1000" height="782" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Library page turn, step by step</title>
<desc id="dsc">Median time to idle per Library page turn on one Kindle Oasis 3: Amazon stock 0.70-0.74 s, each kppfast step cumulative, final 0.26-0.28 s on pages seen before and about 0.42 s on a page's first visit.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:26px;font-weight:700}
.st{font-size:15px;fill:#59636e}
.h{font-size:17px;font-weight:700}
.l{font-size:15px}
.lb{font-size:15px;font-weight:600}
.s{font-size:13.5px;fill:#59636e}
.sx{font-size:13.5px}
.v{font-size:15px;font-weight:700;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.ax{font-size:13px;fill:#818b98}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}
.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;font-weight:700}
.badge{font-size:14px;font-weight:700}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d8dee4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8c959f" stroke-width="2.5"/></pattern><pattern id="hatchb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ddf4ff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6cb6ff" stroke-width="2.5"/></pattern></defs>
<rect x="1" y="1" width="998" height="780" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="36" y="50" class="t">Library page turn, step by step</text>
<text x="36" y="78" class="st">Time to idle (settle), median of 20 turns per phase · one device (Kindle Oasis 3, FW 5.18.2)</text>
<text x="36" y="99" class="st">Each row adds to the row above it</text>
<line x1="40" y1="120" x2="40" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="40" y="624" class="ax" text-anchor="middle">0.0 s</text>
<line x1="146" y1="120" x2="146" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="146" y="624" class="ax" text-anchor="middle">0.1 s</text>
<line x1="252" y1="120" x2="252" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="252" y="624" class="ax" text-anchor="middle">0.2 s</text>
<line x1="358" y1="120" x2="358" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="358" y="624" class="ax" text-anchor="middle">0.3 s</text>
<line x1="464" y1="120" x2="464" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="464" y="624" class="ax" text-anchor="middle">0.4 s</text>
<line x1="570" y1="120" x2="570" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="570" y="624" class="ax" text-anchor="middle">0.5 s</text>
<line x1="676" y1="120" x2="676" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="676" y="624" class="ax" text-anchor="middle">0.6 s</text>
<line x1="782" y1="120" x2="782" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="782" y="624" class="ax" text-anchor="middle">0.7 s</text>
<line x1="888" y1="120" x2="888" y2="602" stroke="#e6eaef" stroke-width="1"/>
<text x="888" y="624" class="ax" text-anchor="middle">0.8 s</text>
<line x1="803.2" y1="120" x2="803.2" y2="602" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="40" y="136" class="l" xml:space="preserve" style="white-space:pre"><tspan font-weight="600">Amazon stock</tspan></text>
<rect x="40" y="144" width="742" height="24" rx="4" fill="#8c959f"/>
<rect x="778" y="144" width="46.4" height="24" rx="4" fill="#8c959f" fill-opacity="0.4"/>
<text x="834.4" y="161" class="v">0.70–0.74 s</text>
<text x="40" y="196" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ </tspan><tspan class="m">libkppfs</tspan><tspan> stat memo + </tspan><tspan class="m">libkppx11</tspan><tspan> X11 shared memory</tspan></text>
<rect x="40" y="204" width="710.2" height="24" rx="4" fill="#9cd1ff"/>
<rect x="746.2" y="204" width="35.8" height="24" rx="4" fill="#9cd1ff" fill-opacity="0.4"/>
<text x="812" y="221" class="v">0.67–0.70 s</text>
<text x="40" y="256" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ cover read-back from the window (</tspan><tspan class="m">KPPX11_PIXBUFWIN</tspan><tspan>)</tspan></text>
<rect x="40" y="264" width="689" height="24" rx="4" fill="#6cb6ff"/>
<text x="739" y="281" class="v">0.65 s</text>
<text x="40" y="316" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ </tspan><tspan class="m">libkppmalloc</tspan><tspan> + </tspan><tspan class="m">libkppimg</tspan></text>
<rect x="40" y="324" width="625.4" height="24" rx="4" fill="#3d8ef0"/>
<rect x="661.4" y="324" width="67.6" height="24" rx="4" fill="#3d8ef0" fill-opacity="0.4"/>
<text x="812" y="341" class="v">0.59–0.65 s</text>
<text x="40" y="376" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ </tspan><tspan class="m">libkpphot</tspan><tspan> (5 patches), </tspan><tspan class="m">libkppside</tspan><tspan>, </tspan><tspan class="m">libkppdb</tspan><tspan>, </tspan><tspan class="m">libkpplog</tspan></text>
<rect x="40" y="384" width="530" height="24" rx="4" fill="#1f6fd1"/>
<text x="580" y="401" class="v">≈0.50 s</text>
<text x="40" y="436" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ Amazon's cover cache 2 → 16 MB, kept across reboots</tspan></text>
<rect x="40" y="444" width="434.6" height="24" rx="4" fill="#0b56b0"/>
<text x="484.6" y="461" class="v">≈0.41 s</text>
<text x="40" y="496" class="l" xml:space="preserve" style="white-space:pre"><tspan>+ Amazon's whole-item cache 1 → 16 MB, mirrored: </tspan><tspan font-weight="700">page seen before</tspan></text>
<rect x="40" y="504" width="265" height="24" rx="4" fill="#1a7f37"/>
<rect x="301" y="504" width="35.8" height="24" rx="4" fill="#1a7f37" fill-opacity="0.4"/>
<text x="346.8" y="521" class="v">0.26–0.28 s</text>
<text x="40" y="556" class="l" xml:space="preserve" style="white-space:pre"><tspan>    same final configuration: </tspan><tspan font-weight="700">page never seen before</tspan></text>
<rect x="40" y="564" width="445.2" height="24" rx="4" fill="#4ac26b"/>
<text x="495.2" y="581" class="v">≈0.42 s</text>
<rect x="446.8" y="503" width="150" height="26" rx="13" fill="#1a7f37"/>
<text x="521.8" y="521" class="badge" text-anchor="middle" style="fill:#ffffff">≈2.6× faster</text>
<rect x="575.2" y="563" width="150" height="26" rx="13" fill="#dafbe1"/>
<text x="650.2" y="581" class="badge" text-anchor="middle" style="fill:#1a7f37">≈1.7× faster</text>
<text x="809.2" y="114" class="ax">stock</text>
<text x="36" y="660" class="s">Settle = start of the injected key press until KPPMainApp's main and JS threads are idle. Includes ~60–76 ms</text>
<text x="36" y="681" class="s">of key injection; the e-ink refresh is not included. Lighter bar ends: spread of the medians across runs.</text>
<text x="36" y="702" class="s">Final configuration also straight after a reboot: 0.26–0.28 s. The first three rows come from earlier sessions.</text>
<text x="36" y="723" class="s">Screens compared with stock at every step; the larger caches show Amazon's own cached tile variant more often.</text>
<text x="964" y="744" class="s" text-anchor="end">Source: docs/RESULTS.md</text>
</svg>
